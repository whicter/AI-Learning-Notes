<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- left panel: one neuron -->
  <text x="30" y="36" font-size="18" font-weight="700" fill="#0f172a">① 一个神经元 Neuron：加权求和 + 激活</text>
  <g font-size="15" fill="#0f172a">
    <circle cx="70" cy="100" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="70" y="105" text-anchor="middle">x₁</text>
    <circle cx="70" cy="170" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="70" y="175" text-anchor="middle">x₂</text>
    <circle cx="70" cy="240" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="70" y="245" text-anchor="middle">x₃</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="92" y1="104" x2="218" y2="160" marker-end="url(#a)"/>
    <line x1="92" y1="170" x2="216" y2="170" marker-end="url(#a)"/>
    <line x1="92" y1="236" x2="218" y2="180" marker-end="url(#a)"/>
  </g>
  <g font-size="14" fill="#b45309" font-weight="600">
    <text x="140" y="118">w₁</text><text x="140" y="162">w₂</text><text x="140" y="228">w₃</text>
  </g>
  <circle cx="260" cy="170" r="40" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="260" y="166" text-anchor="middle" font-size="15" fill="#0f172a">Σ wᵢxᵢ</text>
  <text x="260" y="186" text-anchor="middle" font-size="15" fill="#0f172a">+ b</text>
  <line x1="300" y1="170" x2="338" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="340" y="145" width="80" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="380" y="166" text-anchor="middle" font-size="14" fill="#0f172a">激活函数 σ</text>
  <text x="380" y="185" text-anchor="middle" font-size="12" fill="#166534">activation</text>
  <line x1="420" y1="170" x2="448" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="452" y="172" font-size="15" fill="#0f172a">输出</text><text x="452" y="190" font-size="11" fill="#475569">output</text>
  <text x="30" y="300" font-size="14" fill="#475569">w = 权重 weight（这条输入有多重要）</text>
  <text x="30" y="322" font-size="14" fill="#475569">b = 偏置 bias（整体往上/下挪一点）</text>
  <text x="30" y="344" font-size="14" fill="#475569">σ = 激活 activation：让网络能学"弯曲"的规律</text>

  <line x1="505" y1="30" x2="505" y2="350" stroke="#e2e8f0" stroke-width="2"/>

  <!-- right panel: small network -->
  <text x="530" y="36" font-size="18" font-weight="700" fill="#0f172a">② 排成层 = 神经网络 Neural network</text>
  <g stroke="#94a3b8" stroke-width="1.3">
    <line x1="580" y1="120" x2="710" y2="95"/><line x1="580" y1="120" x2="710" y2="155"/><line x1="580" y1="120" x2="710" y2="215"/><line x1="580" y1="120" x2="710" y2="275"/>
    <line x1="580" y1="185" x2="710" y2="95"/><line x1="580" y1="185" x2="710" y2="155"/><line x1="580" y1="185" x2="710" y2="215"/><line x1="580" y1="185" x2="710" y2="275"/>
    <line x1="580" y1="250" x2="710" y2="95"/><line x1="580" y1="250" x2="710" y2="155"/><line x1="580" y1="250" x2="710" y2="215"/><line x1="580" y1="250" x2="710" y2="275"/>
    <line x1="710" y1="95" x2="840" y2="185"/><line x1="710" y1="155" x2="840" y2="185"/><line x1="710" y1="215" x2="840" y2="185"/><line x1="710" y1="275" x2="840" y2="185"/>
  </g>
  <g stroke-width="2">
    <circle cx="580" cy="120" r="16" fill="#dbeafe" stroke="#3b82f6"/><circle cx="580" cy="185" r="16" fill="#dbeafe" stroke="#3b82f6"/><circle cx="580" cy="250" r="16" fill="#dbeafe" stroke="#3b82f6"/>
    <circle cx="710" cy="95" r="16" fill="#ffedd5" stroke="#f97316"/><circle cx="710" cy="155" r="16" fill="#ffedd5" stroke="#f97316"/><circle cx="710" cy="215" r="16" fill="#ffedd5" stroke="#f97316"/><circle cx="710" cy="275" r="16" fill="#ffedd5" stroke="#f97316"/>
    <circle cx="840" cy="185" r="16" fill="#dcfce7" stroke="#22c55e"/>
  </g>
  <g font-size="14" fill="#0f172a" text-anchor="middle">
    <text x="580" y="312">输入层</text><text x="710" y="312">隐藏层</text><text x="840" y="312">输出层</text><text x="580" y="328" font-size="11" fill="#475569">input</text><text x="710" y="328" font-size="11" fill="#475569">hidden</text><text x="840" y="328" font-size="11" fill="#475569">output</text>
  </g>
  <text x="530" y="350" font-size="14" fill="#475569">训练 training = 微调所有 w、b，让输出接近正确答案</text>
</svg>

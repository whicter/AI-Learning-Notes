<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="940" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">CPU vs GPU vs TPU：少数强核 vs 海量小核 vs 专用矩阵阵列</text>

  <!-- CPU -->
  <rect x="30" y="56" width="280" height="200" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">CPU</text>
  <g fill="#cbd5e1" stroke="#64748b">
    <rect x="70" y="100" width="90" height="56" rx="6"/><rect x="180" y="100" width="90" height="56" rx="6"/>
    <rect x="70" y="166" width="90" height="56" rx="6"/><rect x="180" y="166" width="90" height="56" rx="6"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle"><text x="115" y="133">强核 core</text><text x="225" y="133">强核 core</text><text x="115" y="199">强核 core</text><text x="225" y="199">强核 core</text></g>
  <text x="170" y="244" text-anchor="middle" font-size="12" fill="#475569">擅长分支判断、调度 control flow</text>

  <!-- GPU -->
  <rect x="330" y="56" width="280" height="200" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="470" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">GPU</text>
  <g fill="#86efac">
    <rect x="350" y="100" width="18" height="18"/><rect x="372" y="100" width="18" height="18"/><rect x="394" y="100" width="18" height="18"/><rect x="416" y="100" width="18" height="18"/><rect x="438" y="100" width="18" height="18"/><rect x="460" y="100" width="18" height="18"/><rect x="482" y="100" width="18" height="18"/><rect x="504" y="100" width="18" height="18"/><rect x="526" y="100" width="18" height="18"/><rect x="548" y="100" width="18" height="18"/><rect x="570" y="100" width="18" height="18"/>
    <rect x="350" y="122" width="18" height="18"/><rect x="372" y="122" width="18" height="18"/><rect x="394" y="122" width="18" height="18"/><rect x="416" y="122" width="18" height="18"/><rect x="438" y="122" width="18" height="18"/><rect x="460" y="122" width="18" height="18"/><rect x="482" y="122" width="18" height="18"/><rect x="504" y="122" width="18" height="18"/><rect x="526" y="122" width="18" height="18"/><rect x="548" y="122" width="18" height="18"/><rect x="570" y="122" width="18" height="18"/>
    <rect x="350" y="144" width="18" height="18"/><rect x="372" y="144" width="18" height="18"/><rect x="394" y="144" width="18" height="18"/><rect x="416" y="144" width="18" height="18"/><rect x="438" y="144" width="18" height="18"/><rect x="460" y="144" width="18" height="18"/><rect x="482" y="144" width="18" height="18"/><rect x="504" y="144" width="18" height="18"/><rect x="526" y="144" width="18" height="18"/><rect x="548" y="144" width="18" height="18"/><rect x="570" y="144" width="18" height="18"/>
    <rect x="350" y="166" width="18" height="18"/><rect x="372" y="166" width="18" height="18"/><rect x="394" y="166" width="18" height="18"/><rect x="416" y="166" width="18" height="18"/><rect x="438" y="166" width="18" height="18"/><rect x="460" y="166" width="18" height="18"/><rect x="482" y="166" width="18" height="18"/><rect x="504" y="166" width="18" height="18"/><rect x="526" y="166" width="18" height="18"/><rect x="548" y="166" width="18" height="18"/><rect x="570" y="166" width="18" height="18"/>
    <rect x="350" y="188" width="18" height="18"/><rect x="372" y="188" width="18" height="18"/><rect x="394" y="188" width="18" height="18"/><rect x="416" y="188" width="18" height="18"/><rect x="438" y="188" width="18" height="18"/><rect x="460" y="188" width="18" height="18"/><rect x="482" y="188" width="18" height="18"/><rect x="504" y="188" width="18" height="18"/><rect x="526" y="188" width="18" height="18"/><rect x="548" y="188" width="18" height="18"/><rect x="570" y="188" width="18" height="18"/>
  </g>
  <text x="470" y="230" text-anchor="middle" font-size="12" fill="#166534">成千上万个简单核，同一指令批量算</text>
  <text x="470" y="246" text-anchor="middle" font-size="12" fill="#475569">并行 parallelism · 高带宽显存 HBM</text>

  <!-- TPU -->
  <rect x="630" y="56" width="280" height="200" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="770" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">TPU（Google）</text>
  <g fill="#fed7aa" stroke="#f97316">
    <rect x="700" y="100" width="28" height="28"/><rect x="728" y="100" width="28" height="28"/><rect x="756" y="100" width="28" height="28"/><rect x="784" y="100" width="28" height="28"/>
    <rect x="700" y="128" width="28" height="28"/><rect x="728" y="128" width="28" height="28"/><rect x="756" y="128" width="28" height="28"/><rect x="784" y="128" width="28" height="28"/>
    <rect x="700" y="156" width="28" height="28"/><rect x="728" y="156" width="28" height="28"/><rect x="756" y="156" width="28" height="28"/><rect x="784" y="156" width="28" height="28"/>
    <rect x="700" y="184" width="28" height="28"/><rect x="728" y="184" width="28" height="28"/><rect x="756" y="184" width="28" height="28"/><rect x="784" y="184" width="28" height="28"/>
  </g>
  <text x="770" y="230" text-anchor="middle" font-size="12" fill="#9a3412">脉动阵列 systolic array：专做矩阵乘</text>
  <text x="770" y="246" text-anchor="middle" font-size="12" fill="#475569">效率高，但依赖框架和云厂商支持</text>

  <!-- roles -->
  <rect x="30" y="274" width="880" height="72" rx="10" fill="#f1f5f9"/>
  <text x="46" y="300" font-size="14" font-weight="700" fill="#0f172a">在一个 AI 系统里通常一起出现：</text>
  <text x="46" y="324" font-size="13" fill="#0f172a">CPU 跑业务逻辑、数据预处理、编排 orchestration；GPU/TPU 跑训练和推理里的大规模矩阵运算。系统设计时 GPU 是最贵、最稀缺的资源。</text>
</svg>

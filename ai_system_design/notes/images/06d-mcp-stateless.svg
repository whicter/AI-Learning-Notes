<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">MCP 2026-07-28：从有会话到无状态（stateful → stateless）· Q15 / Q17</text>

  <!-- LEFT: before -->
  <rect x="25" y="55" width="415" height="300" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="40" y="80" font-size="14" font-weight="700" fill="#9a3412">之前（≤ 2025-11-25）：会话在服务端内存</text>
  <rect x="45" y="100" width="90" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="90" y="125" font-size="12" text-anchor="middle" fill="#0f172a">Client</text>
  <rect x="180" y="100" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="230" y="118" font-size="11" text-anchor="middle" fill="#0f172a">网关 gateway</text><text x="230" y="132" font-size="10" text-anchor="middle" fill="#dc2626">粘性路由 sticky</text>
  <rect x="320" y="92" width="105" height="34" rx="6" fill="#ffedd5" stroke="#f97316"/><text x="372" y="113" font-size="11" text-anchor="middle" fill="#0f172a">实例 A（有会话）</text>
  <rect x="320" y="132" width="105" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="372" y="151" font-size="10" text-anchor="middle" fill="#94a3b8">实例 B 用不上</text>
  <line x1="135" y1="120" x2="178" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="115" x2="318" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <g font-size="11" fill="#0f172a">
    <text x="45" y="190">1. initialize 握手 → 服务端发 Mcp-Session-Id</text>
    <text x="45" y="212">2. 之后每个请求带这个头，必须打回同一实例</text>
    <text x="45" y="234">3. 购物车、游标等业务状态挂在会话上</text>
    <text x="45" y="256">4. 要问用户时，服务端主动发请求（elicitation /</text>
    <text x="60" y="274">sampling），SSE 长连接挂着等回复</text>
  </g>
  <text x="45" y="310" font-size="11" fill="#dc2626">代价：水平扩展难、实例一挂会话就丢、</text>
  <text x="45" y="328" font-size="11" fill="#dc2626">serverless（无服务器函数）跑不了</text>

  <!-- RIGHT: after -->
  <rect x="460" y="55" width="415" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="475" y="80" font-size="14" font-weight="700" fill="#166534">之后（2026-07-28）：每个请求自带信息</text>
  <rect x="480" y="100" width="90" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6"/><text x="525" y="125" font-size="12" text-anchor="middle" fill="#0f172a">Client</text>
  <rect x="605" y="100" width="105" height="40" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="657" y="125" font-size="11" text-anchor="middle" fill="#0f172a">网关 gateway</text><text x="657" y="160" font-size="10" text-anchor="middle" fill="#166534">按 Mcp-Method / Mcp-Name 头路由</text>
  <rect x="745" y="92" width="115" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="802" y="110" font-size="10" text-anchor="middle" fill="#0f172a">任意实例 A</text>
  <rect x="745" y="122" width="115" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="802" y="140" font-size="10" text-anchor="middle" fill="#0f172a">任意实例 B</text>
  <line x1="570" y1="120" x2="603" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="710" y1="115" x2="743" y2="106" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="710" y1="125" x2="743" y2="134" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <g font-size="11" fill="#0f172a">
    <text x="480" y="190">1. 没有 initialize、没有 Mcp-Session-Id</text>
    <text x="480" y="212">2. 业务状态 → 服务端发的句柄（handle），</text>
    <text x="495" y="230">作为普通工具参数传回来</text>
    <text x="480" y="252">3. 要问用户 → MRTR（多轮往返请求）：</text>
    <text x="495" y="270">返回 inputRequests / requestState，</text>
    <text x="495" y="288">客户端补齐后带着重放，服务端什么都不记</text>
  </g>
  <text x="480" y="318" font-size="11" fill="#166534">list 结果带 ttlMs + cacheScope，可缓存</text>
  <text x="480" y="336" font-size="11" fill="#166534">网关不用解析 JSON body 就能路由、鉴权</text>

  <!-- deprecations -->
  <rect x="25" y="372" width="850" height="78" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="40" y="395" font-size="13" font-weight="700" fill="#0f172a">弃用清单（deprecated）与迁移节奏</text>
  <text x="40" y="416" font-size="11" fill="#0f172a">Roots · Sampling · Logging · DCR（动态客户端注册，改用 CIMD 客户端元数据文档）：最早在 2027-07-28 之后的版本移除</text>
  <text x="40" y="436" font-size="11" fill="#0f172a">旧 HTTP+SSE 传输：官方弃用登记表写的是 SEP-2596 定稿后 3 个月可移除 · Tasks 移进扩展（extension）· 迁移顺序：先盘点哪些 server 用了会话和被弃用的功能</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="940" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">训练循环 training loop：猜下一个词 → 算错多少 → 找责任 → 微调参数</text>

  <!-- input -->
  <rect x="30" y="70" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="130" y="94" text-anchor="middle" font-size="13" fill="#475569">训练数据里的一句话</text>
  <text x="130" y="116" text-anchor="middle" font-size="14" fill="#0f172a">"The capital of France is"</text>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#166534">正确答案（label）= "Paris"</text>
  <line x1="232" y1="105" x2="272" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 1 -->
  <rect x="276" y="62" width="180" height="86" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="366" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">① 预测 predict</text>
  <text x="366" y="110" text-anchor="middle" font-size="12" fill="#0f172a">模型输出概率（示意）</text>
  <text x="366" y="128" text-anchor="middle" font-size="12" fill="#0f172a">Paris 40% · Lyon 30% · …</text>
  <line x1="458" y1="105" x2="498" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 2 -->
  <rect x="502" y="62" width="190" height="86" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="597" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">② 算损失 loss</text>
  <text x="597" y="110" text-anchor="middle" font-size="12" fill="#0f172a">交叉熵 cross-entropy：</text>
  <text x="597" y="128" text-anchor="middle" font-size="12" fill="#0f172a">对正确答案有多"意外"</text>
  <line x1="694" y1="105" x2="734" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 3 -->
  <rect x="738" y="62" width="180" height="86" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="828" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">③ 反向传播</text>
  <text x="828" y="108" text-anchor="middle" font-size="12" fill="#5b21b6">backpropagation</text>
  <text x="828" y="128" text-anchor="middle" font-size="12" fill="#0f172a">算每个参数的梯度 gradient</text>

  <line x1="828" y1="150" x2="828" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 4 -->
  <rect x="660" y="200" width="258" height="96" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="789" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">④ 更新参数 weight update</text>
  <text x="789" y="248" text-anchor="middle" font-size="12" fill="#0f172a">新权重 = 旧权重 − 学习率 × 梯度</text>
  <text x="789" y="266" text-anchor="middle" font-size="12" fill="#0f172a">优化器 optimizer（Adam / SGD）</text>
  <text x="789" y="284" text-anchor="middle" font-size="12" fill="#475569">每次只改一点点</text>

  <path d="M660,248 L366,248 L366,152" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="510" y="240" text-anchor="middle" font-size="13" fill="#166534">下一批数据，重复数十亿次（training step）</text>

  <!-- bottom: train vs infer -->
  <rect x="30" y="318" width="420" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="344" font-size="14" font-weight="700" fill="#0f172a">自监督 self-supervised：不用人工标注</text>
  <text x="46" y="368" font-size="12" fill="#0f172a">句子本身就带答案：前面的词是输入，下一个词是标签。</text>
  <text x="46" y="390" font-size="12" fill="#0f172a">所以能用上万亿 token 的书、网页、代码来训练。</text>

  <rect x="470" y="318" width="448" height="96" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="486" y="344" font-size="14" font-weight="700" fill="#991b1b">推理 inference 时：只有 ①，没有 ②③④</text>
  <text x="486" y="368" font-size="12" fill="#0f172a">上线的模型权重是冻结的 frozen → 不会从用户对话里"学习"。</text>
  <text x="486" y="390" font-size="12" fill="#0f172a">想让它变好：改 prompt / 加 RAG / 加记忆，或重新训练。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">上下文窗口里装了什么、满了怎么办（context window）· Q20–Q23</text>

  <!-- bar -->
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="80" width="95" height="60" fill="#ede9fe" stroke="#8b5cf6"/><text x="77" y="106" fill="#0f172a">工具定义</text><text x="77" y="122" fill="#475569">tools</text>
    <rect x="125" y="80" width="105" height="60" fill="#ede9fe" stroke="#8b5cf6"/><text x="177" y="106" fill="#0f172a">系统提示</text><text x="177" y="122" fill="#475569">system</text>
    <rect x="230" y="80" width="110" height="60" fill="#fef9c3" stroke="#ca8a04"/><text x="285" y="106" fill="#0f172a">压缩摘要</text><text x="285" y="122" fill="#475569">compaction</text>
    <rect x="340" y="80" width="190" height="60" fill="#fee2e2" stroke="#dc2626"/><text x="435" y="106" fill="#0f172a">旧的工具结果</text><text x="435" y="122" fill="#475569">old tool results（最占地方）</text>
    <rect x="530" y="80" width="130" height="60" fill="#e0f2fe" stroke="#0284c7"/><text x="595" y="106" fill="#0f172a">最近几轮</text><text x="595" y="122" fill="#475569">recent turns</text>
    <rect x="660" y="80" width="120" height="60" fill="#dcfce7" stroke="#16a34a"/><text x="720" y="102" fill="#0f172a">任务状态块</text><text x="720" y="117" fill="#475569">代码注入的</text><text x="720" y="131" fill="#475569">约束 / 进度</text>
    <rect x="780" y="80" width="90" height="60" fill="#f1f5f9" stroke="#64748b"/><text x="825" y="106" fill="#0f172a">新消息</text><text x="825" y="122" fill="#475569">new turn</text>
  </g>
  <!-- cache breakpoint -->
  <line x1="230" y1="68" x2="230" y2="152" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="130" y="64" font-size="11" fill="#7c3aed">← 不变的前缀，命中 KV 缓存（prefix cache）</text>
  <text x="470" y="64" font-size="11" fill="#7c3aed">紫线 = 缓存断点 cache breakpoint：前缀改一个字，后面全部重算</text>

  <!-- actions -->
  <rect x="30" y="200" width="200" height="80" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="130" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">上下文编辑</text>
  <text x="130" y="238" font-size="10" text-anchor="middle" fill="#475569">context editing</text>
  <text x="130" y="258" font-size="10" text-anchor="middle" fill="#0f172a">清掉旧工具结果，留最近几次</text>
  <text x="130" y="272" font-size="10" text-anchor="middle" fill="#0f172a">便宜、不改写对话</text>

  <rect x="245" y="200" width="200" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="345" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">压缩</text>
  <text x="345" y="238" font-size="10" text-anchor="middle" fill="#475569">compaction</text>
  <text x="345" y="258" font-size="10" text-anchor="middle" fill="#0f172a">整段改写成摘要</text>
  <text x="345" y="272" font-size="10" text-anchor="middle" fill="#dc2626">有损：细节和约束可能丢</text>

  <rect x="460" y="200" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">写到外部记忆</text>
  <text x="560" y="238" font-size="10" text-anchor="middle" fill="#475569">memory tool / 进度文件</text>
  <text x="560" y="258" font-size="10" text-anchor="middle" fill="#0f172a">需要时再读回来</text>
  <text x="560" y="272" font-size="10" text-anchor="middle" fill="#0f172a">可以重置会话后接着干</text>

  <rect x="675" y="200" width="195" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="772" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">交给子 agent</text>
  <text x="772" y="238" font-size="10" text-anchor="middle" fill="#475569">sub-agent</text>
  <text x="772" y="258" font-size="10" text-anchor="middle" fill="#0f172a">在它自己的窗口里探索</text>
  <text x="772" y="272" font-size="10" text-anchor="middle" fill="#0f172a">只交回一段精简摘要</text>

  <line x1="435" y1="140" x2="140" y2="198" stroke="#334155" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="435" y1="140" x2="345" y2="198" stroke="#334155" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="595" y1="140" x2="560" y2="198" stroke="#334155" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="595" y1="140" x2="772" y2="198" stroke="#334155" stroke-width="1.3" marker-end="url(#ar)"/>

  <rect x="30" y="305" width="840" height="75" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="46" y="328" font-size="13" font-weight="700" fill="#0f172a">两条规则</text>
  <text x="46" y="350" font-size="11" fill="#0f172a">1. 前缀只追加、不修改（append-only）：工具列表、系统提示里别放时间戳，否则每次都缓存失效、成本按未命中算</text>
  <text x="46" y="368" font-size="11" fill="#0f172a">2. 必须遵守的约束不要只放在对话开头：由代码每轮注入“任务状态块”，压缩或第 20 轮之后也不会丢（Q24）</text>
</svg>

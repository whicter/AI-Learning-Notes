<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" style="fill:#0f172a">三种并行 parallelism：切数据、切层、切矩阵</text>

  <!-- DP -->
  <rect x="30" y="56" width="260" height="290" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="82" font-size="15" font-weight="700" text-anchor="middle" style="fill:#1d4ed8">数据并行 DP（data）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="50" y="100" width="64" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="82" y="140" style="fill:#0f172a">完整模型</text><text x="82" y="158" style="fill:#475569">数据 1/3</text>
    <rect x="128" y="100" width="64" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="160" y="140" style="fill:#0f172a">完整模型</text><text x="160" y="158" style="fill:#475569">数据 2/3</text>
    <rect x="206" y="100" width="64" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="238" y="140" style="fill:#0f172a">完整模型</text><text x="238" y="158" style="fill:#475569">数据 3/3</text>
  </g>
  <path d="M82,200 L82,220 L238,220 L238,200 M160,200 L160,220" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="240" font-size="12" text-anchor="middle" style="fill:#1d4ed8">AllReduce 平均梯度 gradients</text>
  <text x="45" y="270" font-size="12" style="fill:#0f172a">前提：模型一张卡放得下</text>
  <text x="45" y="292" font-size="12" style="fill:#0f172a">推理里 = 多副本 + 负载均衡</text>
  <text x="45" y="314" font-size="12" style="fill:#475569">放不下时：ZeRO / FSDP 把</text>
  <text x="45" y="332" font-size="12" style="fill:#475569">参数和优化器状态分片</text>

  <!-- PP -->
  <rect x="310" y="56" width="260" height="290" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="82" font-size="15" font-weight="700" text-anchor="middle" style="fill:#15803d">流水线并行 PP（pipeline，按层切）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="330" y="100" width="64" height="100" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="362" y="146" style="fill:#0f172a">层 1–10</text>
    <rect x="408" y="100" width="64" height="100" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="440" y="146" style="fill:#0f172a">层 11–20</text>
    <rect x="486" y="100" width="64" height="100" rx="6" fill="#dcfce7" stroke="#22c55e"/><text x="518" y="146" style="fill:#0f172a">层 21–30</text>
  </g>
  <line x1="394" y1="150" x2="406" y2="150" stroke="#15803d" stroke-width="2"/>
  <line x1="472" y1="150" x2="484" y2="150" stroke="#15803d" stroke-width="2"/>
  <text x="440" y="240" font-size="12" text-anchor="middle" style="fill:#15803d">只传层间激活 activations，通信量小</text>
  <text x="325" y="270" font-size="12" style="fill:#0f172a">缺点：流水线“气泡”，</text>
  <text x="325" y="292" font-size="12" style="fill:#0f172a">要切 micro-batch 填满</text>
  <text x="325" y="314" font-size="12" style="fill:#475569">适合跨机器（带宽低）</text>
  <text x="325" y="332" font-size="12" style="fill:#475569">课程叫 layer-wise partitioning</text>

  <!-- TP -->
  <rect x="590" y="56" width="260" height="290" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="720" y="82" font-size="15" font-weight="700" text-anchor="middle" style="fill:#c2410c">张量并行 TP（tensor，切矩阵）</text>
  <rect x="620" y="100" width="200" height="100" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <line x1="686" y1="100" x2="686" y2="200" stroke="#f97316" stroke-dasharray="4 3"/>
  <line x1="753" y1="100" x2="753" y2="200" stroke="#f97316" stroke-dasharray="4 3"/>
  <g font-size="11" text-anchor="middle"><text x="653" y="146" style="fill:#0f172a">GPU0</text><text x="720" y="146" style="fill:#0f172a">GPU1</text><text x="786" y="146" style="fill:#0f172a">GPU2</text></g>
  <text x="720" y="186" font-size="11" text-anchor="middle" style="fill:#475569">同一层的权重矩阵按列/行拆</text>
  <text x="720" y="240" font-size="12" text-anchor="middle" style="fill:#c2410c">每层都要 all-reduce，通信重</text>
  <text x="605" y="270" font-size="12" style="fill:#0f172a">适合单机内（NVLink）</text>
  <text x="605" y="292" font-size="12" style="fill:#0f172a">推理里能降单请求延迟</text>
  <text x="605" y="314" font-size="12" style="fill:#475569">课程叫 operator-wise</text>
  <text x="605" y="332" font-size="12" style="fill:#475569">partitioning</text>

  <rect x="30" y="362" width="820" height="72" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="45" y="388" font-size="14" font-weight="700" style="fill:#6d28d9">大模型实际组合（3D parallelism）</text>
  <text x="45" y="412" font-size="12" style="fill:#0f172a">机内 TP × 跨机 PP × 外层 DP 副本。推理服务的常见说法：“TP 放进一台 8 卡机，放不下再加 PP，吞吐不够就加 DP 副本”。</text>
  <text x="45" y="428" font-size="11" style="fill:#475569">MoE 模型还有专家并行（EP）：不同专家放不同卡，按 token 路由。</text>
</svg>

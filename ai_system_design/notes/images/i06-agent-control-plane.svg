<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" style="fill:#0f172a">Orchestrator 居中调度（control plane）：组件之间不直接互调</text>

  <rect x="30" y="190" width="120" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="220" font-size="14" font-weight="700" text-anchor="middle" style="fill:#0f172a">用户目标 goal</text>
  <text x="90" y="242" font-size="11" text-anchor="middle" style="fill:#475569">+ 身份 / 权限</text>

  <rect x="320" y="170" width="240" height="110" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="440" y="198" font-size="16" font-weight="700" text-anchor="middle" style="fill:#3730a3">Orchestrator（代码 code）</text>
  <text x="440" y="222" font-size="12" text-anchor="middle" style="fill:#0f172a">状态机 state machine / DAG</text>
  <text x="440" y="242" font-size="11" text-anchor="middle" style="fill:#475569">鉴权 auth · 幂等 · 预算 budget</text>
  <text x="440" y="260" font-size="11" text-anchor="middle" style="fill:#475569">步数 / token / 墙钟上限 · trace</text>

  <rect x="320" y="56" width="240" height="78" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="80" font-size="14" font-weight="700" text-anchor="middle" style="fill:#15803d">Planner（LLM）</text>
  <text x="440" y="102" font-size="11" text-anchor="middle" style="fill:#475569">目标 → 子任务 DAG；偏离时重规划</text>
  <text x="440" y="120" font-size="11" text-anchor="middle" style="fill:#b91c1c">不能直接调工具（no direct tool calls）</text>

  <rect x="620" y="170" width="230" height="110" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="735" y="196" font-size="14" font-weight="700" text-anchor="middle" style="fill:#c2410c">Tool 执行层 execution</text>
  <text x="735" y="218" font-size="11" text-anchor="middle" style="fill:#475569">registry：schema、限流、鉴权</text>
  <text x="735" y="236" font-size="11" text-anchor="middle" style="fill:#475569">超时 · 退避 backoff · 熔断</text>
  <text x="735" y="254" font-size="11" text-anchor="middle" style="fill:#475569">写操作带幂等键 idempotency key</text>
  <text x="735" y="272" font-size="11" text-anchor="middle" style="fill:#b91c1c">不能直接写 memory</text>

  <rect x="320" y="320" width="240" height="90" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="440" y="344" font-size="14" font-weight="700" text-anchor="middle" style="fill:#6d28d9">Memory</text>
  <text x="440" y="366" font-size="11" text-anchor="middle" style="fill:#475569">短期：KV 存储（会话、DAG 进度）</text>
  <text x="440" y="384" font-size="11" text-anchor="middle" style="fill:#475569">长期：向量库（经验、文档）</text>
  <text x="440" y="402" font-size="11" text-anchor="middle" style="fill:#475569">订单状态要强一致 strong consistency</text>

  <rect x="620" y="56" width="230" height="78" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="735" y="80" font-size="14" font-weight="700" text-anchor="middle" style="fill:#a16207">Reflection / Critic</text>
  <text x="735" y="102" font-size="11" text-anchor="middle" style="fill:#475569">每步结果对照目标打分</text>
  <text x="735" y="120" font-size="11" text-anchor="middle" style="fill:#475569">偏离 → 重规划 re-plan</text>

  <line x1="150" y1="225" x2="318" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="168" x2="440" y2="136" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="562" y1="225" x2="618" y2="225" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="440" y1="282" x2="440" y2="318" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="545" y1="168" x2="640" y2="136" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- forbidden -->
  <line x1="560" y1="110" x2="650" y2="168" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="590" y="152" font-size="16" font-weight="700" style="fill:#ef4444">✕</text>
  <line x1="680" y1="282" x2="560" y2="350" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="612" y="326" font-size="16" font-weight="700" style="fill:#ef4444">✕</text>

  <rect x="30" y="300" width="250" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="45" y="324" font-size="13" font-weight="700" style="fill:#0f172a">为什么要这样拦</text>
  <text x="45" y="348" font-size="12" style="fill:#475569">· 每次状态变化都经过一处，</text>
  <text x="45" y="366" font-size="12" style="fill:#475569">  可审计 auditable、可回放 replay</text>
  <text x="45" y="390" font-size="12" style="fill:#475569">· 工具层挂了不拖垮 planner</text>
  <text x="45" y="414" font-size="12" style="fill:#475569">· 一条 trace 能定位：是 memory</text>
  <text x="45" y="432" font-size="12" style="fill:#475569">  过期、规划幻觉，还是 API 超时</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">Agent = 一个围绕目标转圈的循环：感知 → 回忆 → 思考 → 行动 → 记录</text>

  <circle cx="300" cy="245" r="150" fill="none" stroke="#e2e8f0" stroke-width="18"/>
  <!-- arrows along circle (clockwise) -->
  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M362,108 A150,150 0 0 1 425,160" marker-end="url(#a)"/>
    <path d="M446,240 A150,150 0 0 1 420,320" marker-end="url(#a)"/>
    <path d="M340,390 A150,150 0 0 1 262,392" marker-end="url(#a)"/>
    <path d="M180,322 A150,150 0 0 1 152,240" marker-end="url(#a)"/>
    <path d="M175,162 A150,150 0 0 1 238,108" marker-end="url(#a)"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="240" y="72" width="120" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="300" y="93" font-weight="700" fill="#1e3a8a">① 感知 Perceive</text><text x="300" y="111" font-size="11" fill="#1e3a8a">读消息 / 文件 / 事件</text>
    <rect x="390" y="168" width="120" height="48" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="450" y="189" font-weight="700" fill="#5b21b6">② 回忆 Recall</text><text x="450" y="207" font-size="11" fill="#5b21b6">取历史 / 偏好 / 知识</text>
    <rect x="345" y="330" width="130" height="48" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="410" y="351" font-weight="700" fill="#9a3412">③ 思考 Reason</text><text x="410" y="369" font-size="11" fill="#9a3412">模型决定下一步</text>
    <rect x="125" y="330" width="130" height="48" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="190" y="351" font-weight="700" fill="#166534">④ 行动 Act</text><text x="190" y="369" font-size="11" fill="#166534">调工具 / 发消息 / 改数据</text>
    <rect x="90" y="168" width="120" height="48" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="150" y="189" font-weight="700" fill="#334155">⑤ 记录 Store</text><text x="150" y="207" font-size="11" fill="#334155">结果写回记忆</text>
  </g>
  <circle cx="300" cy="245" r="52" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="241" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">目标 Goal</text>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#92400e">"约 Sarah 开会"</text>

  <!-- right: three components -->
  <text x="580" y="80" font-size="16" font-weight="700" fill="#0f172a">三大组件（课程的核心框架）</text>
  <g font-size="13">
    <rect x="580" y="96" width="310" height="70" rx="10" fill="#fff7ed" stroke="#f97316"/>
    <text x="596" y="122" font-size="15" font-weight="700" fill="#9a3412">模型 Model = 大脑</text>
    <text x="596" y="146" fill="#0f172a">理解请求、拆任务、决定调哪个工具</text>
    <rect x="580" y="178" width="310" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="596" y="204" font-size="15" font-weight="700" fill="#166534">工具 Tools = 手</text>
    <text x="596" y="228" fill="#0f172a">日历 API、搜索、数据库、发邮件、跑代码</text>
    <rect x="580" y="260" width="310" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="596" y="286" font-size="15" font-weight="700" fill="#1e3a8a">指令 Instructions = 岗位手册</text>
    <text x="596" y="310" fill="#0f172a">角色、目标、能做/不能做、何时找人</text>
  </g>
  <rect x="580" y="350" width="310" height="84" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="596" y="376" font-size="14" font-weight="700" fill="#991b1b">停止条件 stop condition：写死在代码里</text>
  <text x="596" y="400" font-size="13" fill="#0f172a">目标达成 done / 预算用完 budget</text>
  <text x="596" y="422" font-size="13" fill="#0f172a">/ 超时 timeout / 需要人 → escalate</text>
  <text x="30" y="452" font-size="13" fill="#475569">和普通模型的区别（model vs agent）：模型是"计算器"（问一次答一次）；agent 是"助理"（自己决定下一步、用工具、跨时间记事）。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">护栏 guardrails 放在三个关口 + 人工介入 human oversight 的三种位置</text>

  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="20" y="70" width="90" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="65" y="94">用户输入</text><text x="65" y="112" font-size="11" fill="#475569">/ 文档 / 网页</text>
    <rect x="140" y="56" width="170" height="84" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="225" y="80" font-weight="700" fill="#991b1b">🛡 输入护栏 input</text><text x="225" y="100" font-size="11">注入 injection / 越狱 jailbreak</text><text x="225" y="116" font-size="11">PII 脱敏 redaction · 话题范围</text>
    <rect x="340" y="70" width="90" height="56" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="385" y="103" font-weight="700">LLM</text>
    <rect x="460" y="56" width="180" height="84" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="550" y="80" font-weight="700" fill="#991b1b">🛡 工具护栏 tool</text><text x="550" y="100" font-size="11">allowlist · 参数校验 · 限频</text><text x="550" y="116" font-size="11">预演 dry run / 等人批 approval</text>
    <rect x="670" y="70" width="100" height="56" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="720" y="94">工具 tools /</text><text x="720" y="112">外部系统</text>
  </g>
  <g stroke="#475569" stroke-width="2"><line x1="112" y1="98" x2="136" y2="98" marker-end="url(#a)"/><line x1="312" y1="98" x2="336" y2="98" marker-end="url(#a)"/><line x1="432" y1="98" x2="456" y2="98" marker-end="url(#a)"/><line x1="642" y1="98" x2="666" y2="98" marker-end="url(#a)"/></g>
  <path d="M720,128 L720,160 L385,160 L385,130" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="552" y="176" text-anchor="middle" font-size="11" fill="#475569">工具结果回到 LLM（同样当"不可信数据"）</text>
  <path d="M385,128 L385,140" stroke="none"/>
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="300" y="196" width="190" height="72" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="395" y="220" font-weight="700" fill="#991b1b">🛡 输出护栏 output</text><text x="395" y="240" font-size="11">格式(JSON schema) · 引用/事实</text><text x="395" y="256" font-size="11">moderation · 免责声明 · PII</text>
    <rect x="530" y="210" width="90" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="575" y="237">用户</text>
  </g>
  <path d="M352,128 L352,192" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="492" y1="232" x2="526" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="660" y="196" width="280" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="676" y="220" font-size="13" font-weight="700" fill="#0f172a">护栏的代价 trade-offs</text>
  <text x="676" y="242" font-size="12" fill="#0f172a">太严 → 误杀 false positive，用户烦</text>
  <text x="676" y="260" font-size="12" fill="#0f172a">太松 → 漏过 false negative</text>
  <text x="676" y="278" font-size="12" fill="#0f172a">每加一层 → 多一点延迟 latency</text>

  <!-- oversight -->
  <text x="30" y="312" font-size="16" font-weight="700" fill="#0f172a">人什么时候介入？（课程的开车类比）</text>
  <g font-size="13" fill="#0f172a">
    <rect x="20" y="326" width="300" height="116" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="36" y="352" font-size="15" font-weight="700" fill="#1e3a8a">Human-in-the-loop</text>
    <text x="36" y="376">🚗 学车：教练点头才能转弯</text>
    <text x="36" y="400">动作前必须人批（转账、删数据）</text>
    <text x="36" y="424">或模型没把握时主动升级给人</text>

    <rect x="330" y="326" width="300" height="116" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="346" y="352" font-size="15" font-weight="700" fill="#5b21b6">Human-on-the-loop</text>
    <text x="346" y="376">🚗 定速巡航：人盯着，随时接管</text>
    <text x="346" y="400">agent 自己跑，人看仪表盘，</text>
    <text x="346" y="424">可暂停 / 改计划 / 否决</text>

    <rect x="640" y="326" width="300" height="116" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="656" y="352" font-size="15" font-weight="700" fill="#166534">Human-above-the-loop</text>
    <text x="656" y="376">🚗 行车记录仪：事后复盘</text>
    <text x="656" y="400">审计日志、抽查、统计指标，</text>
    <text x="656" y="424">发现问题改规则 / 改 prompt</text>
  </g>
</svg>

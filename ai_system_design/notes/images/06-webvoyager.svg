<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">网页 agent（WebVoyager）：看截图 → 想 → 按编号操作 → 再看截图</text>

  <!-- mock screenshot -->
  <rect x="30" y="56" width="280" height="220" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="30" y="56" width="280" height="24" rx="10" fill="#e2e8f0"/>
  <circle cx="46" cy="68" r="4" fill="#f87171"/><circle cx="60" cy="68" r="4" fill="#fbbf24"/><circle cx="74" cy="68" r="4" fill="#34d399"/>
  <text x="44" y="104" font-size="13" font-weight="700" fill="#0f172a">某购物网站</text>
  <rect x="44" y="116" width="190" height="28" rx="4" fill="#fff" stroke="#e11d48" stroke-width="2"/><text x="52" y="135" font-size="12" fill="#94a3b8">搜索商品…</text>
  <rect x="44" y="108" width="22" height="16" fill="#e11d48"/><text x="55" y="120" text-anchor="middle" font-size="11" fill="#fff">1</text>
  <rect x="242" y="116" width="54" height="28" rx="4" fill="#e2e8f0" stroke="#e11d48" stroke-width="2"/><text x="269" y="135" text-anchor="middle" font-size="12">搜索</text>
  <rect x="242" y="108" width="22" height="16" fill="#e11d48"/><text x="253" y="120" text-anchor="middle" font-size="11" fill="#fff">2</text>
  <rect x="44" y="160" width="120" height="90" rx="4" fill="#fff" stroke="#e11d48" stroke-width="2"/><text x="104" y="210" text-anchor="middle" font-size="12" fill="#475569">商品卡片</text>
  <rect x="44" y="152" width="22" height="16" fill="#e11d48"/><text x="55" y="164" text-anchor="middle" font-size="11" fill="#fff">3</text>
  <rect x="176" y="160" width="120" height="90" rx="4" fill="#fff" stroke="#e11d48" stroke-width="2"/><text x="236" y="210" text-anchor="middle" font-size="12" fill="#475569">商品卡片</text>
  <rect x="176" y="152" width="22" height="16" fill="#e11d48"/><text x="187" y="164" text-anchor="middle" font-size="11" fill="#fff">4</text>
  <text x="170" y="296" text-anchor="middle" font-size="12" fill="#e11d48">Set-of-Mark：脚本给每个可点元素画框编号</text>
  <text x="170" y="314" text-anchor="middle" font-size="12" fill="#475569">+ 文字清单 text list（编号、类型、文字）</text>

  <line x1="314" y1="160" x2="356" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- LMM -->
  <rect x="360" y="70" width="290" height="190" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="505" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">多模态模型 multimodal LLM</text>
  <rect x="376" y="112" width="258" height="58" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="388" y="134" font-size="12" font-weight="700" fill="#5b21b6">Thought：</text>
  <text x="388" y="156" font-size="12" fill="#0f172a">要先搜 iPad 保护壳，输入框是 [1]</text>
  <rect x="376" y="180" width="258" height="58" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="388" y="202" font-size="12" font-weight="700" fill="#166534">Action：</text>
  <text x="388" y="224" font-size="12" font-family="Menlo, monospace" fill="#0f172a">Type [1]; iPad case</text>

  <line x1="652" y1="160" x2="694" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="698" y="110" width="232" height="100" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="814" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">浏览器执行 browser</text>
  <text x="814" y="164" text-anchor="middle" font-size="12" fill="#0f172a">（如 Playwright）</text>
  <text x="814" y="188" text-anchor="middle" font-size="12" fill="#0f172a">页面变化 → 新截图 screenshot</text>
  <path d="M814,212 L814,340 L170,340 L170,324" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="560" y="332" text-anchor="middle" font-size="12" fill="#166534">循环 loop，直到 Answer 动作（或步数预算 step budget 用完）</text>

  <!-- action space -->
  <text x="372" y="284" font-size="12" fill="#475569">7 个动作：Click · Type · Scroll · Wait · Back · 跳搜索引擎 · Answer</text>

  <!-- context clipping -->
  <text x="30" y="380" font-size="15" font-weight="700" fill="#0f172a">上下文裁剪 context clipping：截图只留最近 3 张</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="394" width="70" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="65" y="418" fill="#94a3b8">截图1 ✂</text>
    <rect x="108" y="394" width="70" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="143" y="418" fill="#94a3b8">截图2 ✂</text>
    <rect x="186" y="394" width="70" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="221" y="418">截图3</text>
    <rect x="264" y="394" width="70" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="299" y="418">截图4</text>
    <rect x="342" y="394" width="70" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="377" y="418">截图5</text>
  </g>
  <text x="30" y="456" font-size="12" fill="#475569">想法和动作全留。取舍：全留 = 记得多但贵；</text>
  <text x="30" y="474" font-size="12" fill="#475569">只留近的 = 专注、便宜，但可能忘了早期信息</text>

  <!-- failure breakdown -->
  <text x="480" y="380" font-size="15" font-weight="700" fill="#0f172a">失败原因 failure modes（占失败案例比例）</text>
  <g font-size="12" fill="#0f172a">
    <text x="480" y="408">导航卡住 navigation</text><rect x="610" y="396" width="200" height="16" fill="#ef4444"/><text x="816" y="408">44.4%</text>
    <text x="480" y="434">看错元素 grounding</text><rect x="610" y="422" width="112" height="16" fill="#f97316"/><text x="728" y="434">24.8%</text>
    <text x="480" y="460">自认完成 false done</text><rect x="610" y="448" width="98" height="16" fill="#eab308"/><text x="714" y="460">21.8%</text>
    <text x="480" y="486">没按指令 misaligned</text><rect x="610" y="474" width="40" height="16" fill="#94a3b8"/><text x="656" y="486">9.0%</text>
  </g>
  <text x="30" y="508" font-size="11" fill="#94a3b8">来源：WebVoyager 论文（He et al., 2024），经课程转述；总成功率 59.1%（643 个真实网站任务）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">带保护的 ReAct 循环（guarded ReAct loop）· Q4 / Q13</text>

  <!-- loop-level guard frame -->
  <rect x="30" y="55" width="840" height="300" rx="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="46" y="77" font-size="13" font-weight="700" fill="#334155">① 循环级（loop level）：最大步数 max steps · token 预算 token budget · 截止时间 deadline → 超了就进入明确终态，不静默截断</text>

  <!-- model call -->
  <rect x="60" y="110" width="170" height="64" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="145" y="137" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">调模型 model call</text>
  <text x="145" y="157" font-size="11" text-anchor="middle" fill="#475569">Thought + 选工具</text>

  <!-- stop_reason -->
  <polygon points="345,105 425,142 345,179 265,142" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="345" y="139" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">stop_reason?</text>
  <text x="345" y="155" font-size="10" text-anchor="middle" fill="#475569">停止原因</text>
  <line x1="230" y1="142" x2="263" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- final answer -->
  <rect x="270" y="210" width="150" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="345" y="233" font-size="12" text-anchor="middle" fill="#0f172a">最终回答 end_turn</text>
  <line x1="345" y1="179" x2="345" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- call-level guards -->
  <rect x="465" y="95" width="200" height="110" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="565" y="116" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">② 调用级（call level）</text>
  <text x="478" y="137" font-size="11" fill="#0f172a">· 未知工具 unknown tool</text>
  <text x="478" y="154" font-size="11" fill="#0f172a">· 参数校验 schema validation</text>
  <text x="478" y="171" font-size="11" fill="#0f172a">· 重复调用 dedup hash</text>
  <text x="478" y="188" font-size="11" fill="#0f172a">· 写操作授权 write authz</text>
  <line x1="425" y1="142" x2="463" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="444" y="133" font-size="10" text-anchor="middle" fill="#475569">tool_use</text>

  <!-- executor -->
  <rect x="705" y="110" width="150" height="64" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="780" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">执行工具</text>
  <text x="780" y="153" font-size="11" text-anchor="middle" fill="#475569">tool executor</text>
  <line x1="665" y1="142" x2="703" y2="142" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- exec-level guards -->
  <rect x="705" y="195" width="150" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="780" y="214" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">③ 执行级（execution）</text>
  <text x="780" y="231" font-size="10" text-anchor="middle" fill="#0f172a">超时 timeout</text>
  <text x="780" y="245" font-size="10" text-anchor="middle" fill="#0f172a">返回字节上限 byte budget</text>
  <line x1="780" y1="174" x2="780" y2="193" stroke="#334155" stroke-width="1.4"/>

  <!-- tool_result back -->
  <path d="M780,251 L780,300 L145,300 L145,176" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="460" y="293" font-size="12" text-anchor="middle" fill="#0f172a">配对的 tool_result（paired tool_result，带同一个 tool_use_id）= Observation</text>

  <!-- typed error back -->
  <path d="M565,205 L565,268 L190,268 L190,176" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="440" y="262" font-size="11" text-anchor="middle" fill="#dc2626">被拦下：返回有类型的错误（typed error）给模型，让它换做法，而不是抛异常让循环崩掉</text>

  <text x="46" y="335" font-size="11" fill="#475569">上下文编辑（context editing）：旧的 tool_result 清掉、只留最近几次 → 防止第 30 步之后上下文被重复结果塞满（Q13）</text>

  <!-- trace band -->
  <rect x="30" y="375" width="840" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="46" y="398" font-size="13" font-weight="700" fill="#0f172a">留痕（trace）：每一步都记一条 span</text>
  <text x="46" y="420" font-size="11" fill="#0f172a">step 序号 · 模型输入 token / 输出 token · 选了哪个工具 + 参数哈希 · 被哪道保护拦下 · 工具耗时与返回大小 · 终态（done / budget_exceeded / blocked）</text>
  <text x="46" y="437" font-size="11" fill="#475569">线上排查“第 30 步开始重复调工具”时，靠参数哈希连续相同 + 结果相同就能定位，不用重放整段对话</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">常驻个人助理（OpenClaw 式）的分层架构：LLM 只是其中一个零件</text>

  <!-- channels -->
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="30" y="64" width="110" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="85" y="86">WhatsApp</text>
    <rect x="30" y="106" width="110" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="85" y="128">Slack</text>
    <rect x="30" y="148" width="110" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="85" y="170">Telegram</text>
    <rect x="30" y="190" width="110" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="85" y="212">Web UI</text>
  </g>
  <g stroke="#475569" stroke-width="1.8"><line x1="142" y1="81" x2="178" y2="130" marker-end="url(#a)"/><line x1="142" y1="123" x2="176" y2="138" marker-end="url(#a)"/><line x1="142" y1="165" x2="176" y2="152" marker-end="url(#a)"/><line x1="142" y1="207" x2="178" y2="160" marker-end="url(#a)"/></g>

  <rect x="180" y="100" width="170" height="90" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="265" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">① Channel 层</text>
  <text x="265" y="148" text-anchor="middle" font-size="12" fill="#0f172a">消息统一格式 normalize</text>
  <text x="265" y="168" text-anchor="middle" font-size="12" fill="#0f172a">回复按平台规则发出</text>
  <line x1="352" y1="145" x2="386" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="390" y="64" width="260" height="162" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="520" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">② Gateway 控制面 control plane</text>
  <g font-size="12" fill="#0f172a">
    <text x="406" y="118">• 把消息路由到对应 session</text>
    <text x="406" y="140">• 鉴权；默认只监听本机 127.0.0.1</text>
    <text x="406" y="162">• 管生命周期：启动、热更新</text>
    <text x="406" y="184">• 定时任务 cron → 主动触发 agent</text>
    <text x="406" y="206" fill="#5b21b6">常驻进程 long-running：助理的"操作系统"</text>
  </g>
  <rect x="700" y="64" width="230" height="162" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="815" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">为什么不用 serverless？</text>
  <g font-size="12" fill="#0f172a">
    <text x="716" y="118">• 要 24/7 保持平台长连接</text>
    <text x="716" y="140">• 冷启动 cold start 会卡顿</text>
    <text x="716" y="162">• 要能自己定时醒来干活</text>
    <text x="716" y="190" fill="#92400e">代价 trade-off：自己管宕机恢复、</text>
    <text x="716" y="210" fill="#92400e">内存增长、优雅重启</text>
  </g>
  <line x1="520" y1="228" x2="520" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="300" y="266" width="440" height="110" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="520" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">③ Agent Runtime（推理循环 agent loop）</text>
  <text x="520" y="318" text-anchor="middle" font-size="12" fill="#0f172a">组装上下文（历史 + 检索到的记忆 + 系统提示）→ 调 LLM</text>
  <text x="520" y="340" text-anchor="middle" font-size="12" fill="#0f172a">→ 拦截工具调用、做权限检查 → 把结果喂回 LLM → 循环</text>
  <text x="520" y="362" text-anchor="middle" font-size="12" fill="#9a3412">上下文快满：LLM 压缩 compaction；失败就重置会话，保证不挂</text>

  <rect x="790" y="286" width="140" height="70" rx="12" fill="#3b82f6"/>
  <text x="860" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">LLM</text>
  <text x="860" y="338" text-anchor="middle" font-size="11" fill="#dbeafe">只负责推理和规划</text>
  <path d="M742,312 L786,312" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M788,332 L744,332" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <line x1="420" y1="378" x2="300" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="378" x2="700" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="414" width="380" height="118" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="270" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">④ 记忆与状态层 memory &amp; state</text>
  <g font-size="12" fill="#0f172a">
    <text x="98" y="468">• 对话记录：只追加 append-only 的 JSONL 日志</text>
    <text x="98" y="490">• 本地 SQLite：向量 + 关键词混合检索 hybrid</text>
    <text x="98" y="512">• 记忆当"预算 budget"管：不是无限存档</text>
  </g>

  <rect x="500" y="414" width="430" height="118" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="715" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">⑤ 工具执行层 tool execution（"手"）</text>
  <g font-size="12" fill="#0f172a">
    <text x="518" y="468">• shell 命令、读写文件、驱动浏览器</text>
    <text x="518" y="490">• 不可信会话 → Docker 沙箱 sandbox（非 root、只读）</text>
    <text x="518" y="512">• 高危命令被拦下，等用户批准 human approval</text>
  </g>
</svg>
